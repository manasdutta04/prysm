services:
  backend:
    build: ./backend
    container_name: prysm-backend
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb+srv://manasdutta1509:manas123@cluster0.pxlpxap.mongodb.net/?appName=Cluster0}
      - JWT_SECRET=${JWT_SECRET:-f3a7c92b8d4e1a5f6c0b9d8e7a4f3c2b1a0d9e8f7a6b5c4d3e2f1a0b9c8d7e6}
      - FRONTEND_URL=http://localhost:8080
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: prysm-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
